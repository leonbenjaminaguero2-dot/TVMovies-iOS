name: TVMovies Android y PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-mobile:
    name: TVMovies Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar proyecto independiente
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#000000">
            <title>TVMovies</title>
          </head>
          <body style="margin:0;background:#000;color:white">
            <script>
              location.replace(
                "https://playtvmoviesformobile.duckdns.org/"
              );
            </script>
          </body>
          </html>
          EOF

          cat > package.json <<'EOF'
          {
            "name": "tvmovies-android-build",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tvmovies.mobile",
            "appName": "TVMovies",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TVMovies-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  android-tv:
    name: TVMovies Android TV
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar proyecto TV
        run: |
          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>TVMovies TV</title>
          </head>
          <body style="margin:0;background:#000;color:white">
            <script>
              location.replace(
                "https://playtvmoviesfortv.duckdns.org/"
              );
            </script>
          </body>
          </html>
          EOF

          cat > package.json <<'EOF'
          {
            "name": "tvmovies-tv-build",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tvmovies.tv",
            "appName": "TVMovies TV",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK TV
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK TV
        uses: actions/upload-artifact@v4
        with:
          name: TVMovies-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  windows:
    name: TVMovies PC portable
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar aplicación
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force www | Out-Null

          @'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>TVMovies PC</title>
          </head>
          <body style="margin:0">
            <script>
              location.replace(
                "https://playtvmoviesforpc.netlify.app/"
              );
            </script>
          </body>
          </html>
          '@ | Set-Content -Encoding UTF8 www/index.html

          @'
          {
            "name": "tvmovies-pc",
            "version": "1.0.0",
            "private": true,
            "main": "main.js",
            "scripts": {
              "dist": "electron-builder --win portable"
            },
            "devDependencies": {
              "electron": "^35.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.tvmovies.pc",
              "productName": "TVMovies PC",
              "win": {
                "target": ["portable"]
              }
            }
          }
          '@ | Set-Content -Encoding UTF8 package.json

          @'
          const { app, BrowserWindow } = require("electron");

          app.whenReady().then(() => {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              autoHideMenuBar: true
            });

            win.loadURL(
              "https://playtvmoviesforpc.netlify.app/"
            );
          });
          '@ | Set-Content -Encoding UTF8 main.js

      - name: Instalar dependencias
        run: npm install

      - name: Crear EXE portable
        run: npm run dist

      - name: Guardar EXE
        uses: actions/upload-artifact@v4
        with:
          name: TVMovies-PC-Portable
          path: dist/*.exe
          retention-days: 7
