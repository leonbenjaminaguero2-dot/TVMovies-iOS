name: TVMovies - Android, TV y PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-mobile:
    name: APK Android móvil
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Crear aplicación
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>TVMovies</title>
          </head>
          <body style="margin:0">
            <script>
              location.replace("https://playtvmoviesformobile.duckdns.org/");
            </script>
          </body>
          </html>
          EOF
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npx cap init TVMovies com.tvmovies.mobile --web-dir www
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TVMovies-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-tv:
    name: APK Android TV
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Crear aplicación TV
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>TVMovies TV</title>
          </head>
          <body style="margin:0">
            <script>
              location.replace("https://playtvmoviesfortv.duckdns.org/");
            </script>
          </body>
          </html>
          EOF
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npx cap init "TVMovies TV" com.tvmovies.tv --web-dir www
          npx cap add android
          npx cap sync android
      - name: Compilar APK TV
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Guardar APK TV
        uses: actions/upload-artifact@v4
        with:
          name: TVMovies-Android-TV
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: EXE portable para Windows
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crear aplicación
        shell: pwsh
        run: |
          @'
          {
            "name": "tvmovies-pc",
            "version": "1.0.0",
            "private": true,
            "main": "main.js",
            "scripts": {
              "dist": "electron-builder --win portable"
            },
            "devDependencies": {
              "electron": "^35.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.tvmovies.pc",
              "productName": "TVMovies PC",
              "win": {
                "target": ["portable"]
              }
            }
          }
          '@ | Set-Content -Encoding utf8 package.json
          @'
          const { app, BrowserWindow } = require("electron");

          app.whenReady().then(() => {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              autoHideMenuBar: true
            });

            win.loadURL("https://playtvmoviesforpc.netlify.app/");
          });
          '@ | Set-Content -Encoding utf8 main.js
      - name: Instalar dependencias
        run: npm install
      - name: Compilar EXE
        run: npm run dist
      - name: Guardar EXE portable
        uses: actions/upload-artifact@v4
        with:
          name: TVMovies-PC-Portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
