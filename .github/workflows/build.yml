name: Build TVMovies IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto iOS
        run: npx cap add ios

      - name: Instalar generador de iconos
        run: npm install --no-save @capacitor/assets

      - name: Generar iconos
        run: npx capacitor-assets generate --ios

      - name: Ocultar barra de estado
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" ios/App/App/Info.plist

      - name: Sincronizar proyecto
        run: npx cap sync ios

      - name: Compilar aplicación
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          /usr/bin/zip -r TVMovies.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: TVMovies-IPA
          path: TVMovies.ipa
          retention-days: 7
